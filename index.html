<!doctype html>
<html lang="ru">
<head>

  <title>Telegram Profile — h.</title>
  <style>
    :root { --text:#fff; --muted:rgba(255,255,255,.72); --glass:rgba(10,10,16,.44); }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      overflow:hidden;
      min-height:100svh;
      background:#090a0e;
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .scene { position:relative; min-height:100svh; display:grid; place-items:center; isolation:isolate; overflow:hidden; }
    .background { position:absolute; inset:-4%; z-index:-3; filter:blur(5px) saturate(.78) brightness(.66); transform:scale(1.06); }
    .background svg { display:block; width:100%; height:100%; }
    .vignette { position:absolute; inset:0; z-index:-2; background:radial-gradient(ellipse at 50% 42%, transparent 5%, rgba(0,0,0,.14) 52%, rgba(0,0,0,.68) 100%), linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.2)); }
    .grain { position:absolute; inset:0; z-index:-1; opacity:.1; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E"); mix-blend-mode:screen; }
    .profile {
      width:min(520px, calc(100% - 38px));
      padding:42px 36px 34px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:30px;
      background:linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.035));
      box-shadow:0 26px 80px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.18);
      backdrop-filter:blur(13px);
      -webkit-backdrop-filter:blur(13px);
      animation:rise .8s ease-out both;
    }
    .avatar { width:86px; height:86px; margin:0 auto 26px; display:grid; place-items:center; border-radius:50%; color:#fff; font-size:32px; font-weight:700; letter-spacing:-2px; background:linear-gradient(145deg,#d9a8c9,#6b4f78 65%,#272438); border:2px solid rgba(255,255,255,.72); box-shadow:0 8px 28px rgba(0,0,0,.4), inset 0 1px 10px rgba(255,255,255,.28); }
    .info { font-size:33px; line-height:1.42; font-weight:400; letter-spacing:-.8px; text-align:left; text-shadow:0 2px 8px rgba(0,0,0,.55); }
    .line { margin:0; white-space:nowrap; }
    .label { color:rgba(255,255,255,.88); }
    .value { color:#fff; }
    .handle { color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.55); transition:border-color .2s, opacity .2s; }
    .handle:hover { border-color:#fff; opacity:.8; }
    .coming { margin:30px 0 0; text-align:center; color:var(--muted); font-size:20px; letter-spacing:5px; text-transform:none; text-shadow:0 2px 7px rgba(0,0,0,.5); }
    .accent { width:52px; height:2px; margin:22px auto 0; border-radius:2px; background:rgba(255,255,255,.72); box-shadow:0 0 15px rgba(255,210,236,.8); }
    @keyframes rise { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @media (max-width:560px) { .profile { padding:34px 24px 28px; border-radius:25px; } .info { font-size:clamp(23px, 7vw, 33px); letter-spacing:-.5px; } .avatar { width:74px; height:74px; font-size:27px; margin-bottom:21px; } .coming { font-size:16px; letter-spacing:4px; margin-top:24px; } }
  </style>
</head>

  <script>
    const profile = document.querySelector('.profile');
    document.addEventListener('pointermove', (event) => {
      const x = (event.clientX / innerWidth - .5) * 2;
      const y = (event.clientY / innerHeight - .5) * 2;
      profile.style.transform = `perspective(900px) rotateY(${x * 2}deg) rotateX(${y * -1.5}deg)`;
    });
    document.addEventListener('pointerleave', () => { profile.style.transform = ''; });
  </script>
